  /v1/documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        description: Document ID. Numeric for NPR-originated documents, prefixed for station documents.
        schema: &ref_27
          description: NPR's document ID schema; numeric IDs are NPR-originated, prefixed IDs belong to the client owning the prefix.
          $schema: https://json-schema.org/draft/2019-09/schema
          $id: https://content.api.npr.org/v1/schemas/documentId.json
          title: Document ID
          type: string
          pattern: ^([1-9]+[0-9]*(-[a-z0-9-]+)?|[a-z]+[a-z0-9]*-[a-z0-9-]+)$
        example: nx-s1-5453317
    get:
      tags:
        - Documents
      operationId: getDocument
      summary: Get one document
      description: |
        Return a single document by ID. The body uses the same `resources` envelope as a query,
        holding exactly one document. `transclude` is the only query parameter accepted here.
      parameters:
        - name: transclude
          in: query
          description: |
            Pre-fetch linked documents into an `embed` field on the matching link objects.
            Known limits documented by NPR (Feb 2024): `bylines` only resolves text bylines, and
            `transcript` does not work as expected.
          explode: false
          schema: *ref_14
          example: *ref_15
      responses:
        '200':
          description: Matching documents. Empty `resources` when nothing matches.
          content: *ref_16
        '400':
          description: Invalid parameter or body. Details in `meta.messages`.
          content: *ref_17
        '401':
          description: Missing or unrecognized bearer token.
          content: *ref_18
        '404':
          description: No document, profile or schema with that ID.
          content: &ref_23
            application/json:
              schema:
                type: object
                properties: *ref_12
                example: *ref_13
        '503':
          description: Transient. NPR asks clients to retry later; no `Retry-After` header is documented.
    put:
      tags:
        - Documents
      operationId: putDocument
      summary: Create or update a document
      description: |
        Create the document if the ID is new, otherwise replace it. The ID in the path must
        start with the client's assigned document prefix, or the existing document's
        `authorizedOrgServiceIds` must include one of the client's services. The body must
        validate against every profile it lists. `meta` is read-only; if present it must be
        returned as received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                A standalone CDS document as returned by the documents endpoints: the base `document`
                profile plus `publishable`, which every ingestable top-level document carries.
                Additional top-level fields depend on the other profiles listed in `profiles`
                (for example `audio` from `has-audio`, `images` from `has-images`, `layout` from
                `buildout`, `items` from `aggregation`). The named composites below cover the common
                cases; for any profile, compose `Document` with `./profiles/<name>.json`.
                Nested assets under `assets` are themselves documents keyed by ID and are referenced
                from `audio`, `images`, `layout` and `bylines` with `#/assets/<id>` links.
              allOf: *ref_19
      responses:
        '200':
          description: Document updated.
          content:
            application/json:
              schema:
                type: object
                description: Envelope for every document read. A single-document GET returns one element.
                required: *ref_20
                properties: *ref_21
        '201':
          description: Document created.
          content:
            application/json:
              schema:
                type: object
                description: Envelope for every document read. A single-document GET returns one element.
                required: *ref_20
                properties: *ref_21
        '400':
          description: Invalid parameter or body. Details in `meta.messages`.
          content: *ref_17
        '401':
          description: Missing or unrecognized bearer token.
          content: *ref_18
        '403':
          description: The token is valid but not allowed to write this document.
          content: &ref_22
            application/json:
              schema:
                type: object
                properties: *ref_12
                example: *ref_13
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      summary: Delete a document
      description: Same write authorization rules as `PUT`.
      responses:
        '204':
          description: Document deleted.
        '401':
          description: Missing or unrecognized bearer token.
          content: *ref_18
        '403':
          description: The token is valid but not allowed to write this document.
          content: *ref_22
        '404':
          description: No document, profile or schema with that ID.
          content: *ref_23
