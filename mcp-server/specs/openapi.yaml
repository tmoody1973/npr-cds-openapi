components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by NPR Member Partnership. One token per client.
  parameters:
    documentId:
      name: documentId
      in: path
      required: true
      description: Document ID. Numeric for NPR-originated documents, prefixed for station documents.
      schema: *ref_27
      example: nx-s1-5453317
    ids:
      name: ids
      in: query
      description: Only documents whose ID is in this list.
      explode: false
      schema: *ref_28
      example: *ref_29
    excludedIds:
      name: excludedIds
      in: query
      description: Documents whose ID is in this list are removed from the result.
      explode: false
      schema: *ref_30
    profileIds:
      name: profileIds
      in: query
      description: Only documents that list one of these profiles at the top level. Repeat the parameter to require several.
      explode: false
      schema: *ref_31
      example: *ref_32
    excludedProfileIds:
      name: excludedProfileIds
      in: query
      description: Documents listing any of these profiles at the top level are removed.
      explode: false
      schema: *ref_33
    collectionIds:
      name: collectionIds
      in: query
      description: |
        Only documents belonging to one of these collections, whether the membership is
        unordered (the document links to the collection) or ordered (the collection's `items`
        lists the document). Use exactly one ID here when sorting with `sort=editorial`.
      explode: false
      schema: *ref_34
      example: *ref_35
    ownerHrefs:
      name: ownerHrefs
      in: query
      description: |
        Only documents whose `owners` array contains one of these Organization Service URIs.
        This is how to scope a query to one station.
      explode: false
      schema: *ref_36
      example: *ref_37
    excludedOwnerHrefs:
      name: excludedOwnerHrefs
      in: query
      description: Documents owned by any of these services are removed.
      explode: false
      schema: *ref_38
    nprWebsitePaths:
      name: nprWebsitePaths
      in: query
      description: Only documents whose `nprWebsitePaths` contains one of these npr.org paths.
      explode: false
      schema: *ref_39
      example: *ref_40
    publishDateTime:
      name: publishDateTime
      in: query
      description: Date or date range on `publishDateTime`. See the date syntax in the API description.
      schema: *ref_41
      example: 2024-01-01...2024-12-31
    editorialLastModifiedDateTime:
      name: editorialLastModifiedDateTime
      in: query
      description: Date or date range on `editorialLastModifiedDateTime`. Useful for incremental sync.
      schema: *ref_42
      example: 2024-06-01T00:00:00Z...
    recommendUntilDateTime:
      name: recommendUntilDateTime
      in: query
      description: Date or date range on `recommendUntilDateTime`.
      schema: *ref_43
    showDates:
      name: showDates
      in: query
      description: The full-date subset of `DateOrRange` (no time part), matched against entries in `showDates`.
      schema: *ref_44
      example: '2024-01-01'
    seasonNumber:
      name: seasonNumber
      in: query
      description: Single season number; meaningful with `profileIds=podcast-episode`.
      schema: *ref_45
    sort:
      name: sort
      in: query
      description: |
        `<field>[:<direction>[:<missing>]]`, comma-separated for multi-field sort, evaluated
        left to right. Fields: `publishDateTime`, `editorialLastModifiedDateTime`, `showDates`,
        `seasonNumber`, `episodeNumber`, and `editorial` (no direction; requires exactly one
        `collectionIds` value; ordered items first, then the rest by `publishDateTime`).
        Direction is `asc` or `desc`, default `desc`. `missing` is `first` or `last` and places
        documents lacking the field, independent of direction.
      schema: *ref_46
      example: seasonNumber:asc:last,episodeNumber:asc
    limit:
      name: limit
      in: query
      description: Documents per page. `offset + limit` must not exceed 2000.
      schema: *ref_25
    offset:
      name: offset
      in: query
      description: Zero-based start position. `offset + limit` must not exceed 2000.
      schema: *ref_26
    transclude:
      name: transclude
      in: query
      description: |
        Pre-fetch linked documents into an `embed` field on the matching link objects.
        Known limits documented by NPR (Feb 2024): `bylines` only resolves text bylines, and
        `transcript` does not work as expected.
      explode: false
      schema: *ref_14
      example: *ref_15
  responses:
    DocumentsOk:
      description: Matching documents. Empty `resources` when nothing matches.
      content: *ref_16
    BadRequest:
