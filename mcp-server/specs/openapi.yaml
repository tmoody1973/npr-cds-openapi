  /v1/subscriptions/confirmations:
    post:
      tags:
        - Subscriptions
      operationId: confirmSubscription
      summary: Confirm a notification subscription
      description: |
        NPR-internal. A client's webhook receives a `SubscriptionConfirmation` message when a
        subscription is created and must forward that body here unmodified. Ongoing
        notifications carry `type` of `document.created`, `document.updated` or
        `document.deleted`; see the official Notifications page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The confirmation message exactly as received by the webhook.
              properties:
                Type:
                  type: string
                  const: SubscriptionConfirmation
              additionalProperties: true
