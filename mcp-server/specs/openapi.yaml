    Unauthorized:
      description: Missing or unrecognized bearer token.
      content: *ref_18
    Forbidden:
      description: The token is valid but not allowed to write this document.
      content: *ref_22
    NotFound:
      description: No document, profile or schema with that ID.
      content: *ref_23
    ServiceUnavailable:
      description: Transient. NPR asks clients to retry later; no `Retry-After` header is documented.
  schemas:
    Link:
      description: NPR's shared link object. `href` may be an absolute URL, a CDS path such as `/v1/documents/1002`, or a fragment such as `#/assets/1003` pointing into the same document's `assets`.
      $schema: https://json-schema.org/draft/2019-09/schema
